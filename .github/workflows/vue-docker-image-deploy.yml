name: Build and Push Vue client Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "src/clients/vue/**"
      - ".github/workflows/vue-docker-image-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/clients/vue/Dockerfile
          push: true
          tags: trogdev/quickchat-client-vue:latest
